appId: com.aiinbox.app
productName: AI-inbox
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*
extraResources:
  - from: resources/
    to: ./
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
